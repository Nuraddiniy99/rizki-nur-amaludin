<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3eee5"><meta name="description" content="Curriculum Vitae Rizki Nur Amaludin — Arabic Language Specialist, Islamic Education, Travel & Hospitality, Creative Digital Media.">
<title>Rizki Nur Amaludin — Personal CV</title>
<style>
:root{--bg:#f3eee5;--paper:rgba(255,255,255,.67);--ink:#171715;--muted:#77736c;--line:rgba(31,29,25,.12);--accent:#b69d78;--shadow:0 24px 70px rgba(38,31,21,.09);--radius:26px}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:95px}body{margin:0;background:radial-gradient(ellipse at 15% 4%,#fffdf8 0,transparent 34%),radial-gradient(ellipse at 90% 28%,#e8dfd1 0,transparent 30%),var(--bg);color:var(--ink);font:15px/1.7 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(1160px,calc(100% - 38px));margin:auto}.nav{position:sticky;top:12px;z-index:20;margin:12px auto 30px;width:min(1160px,calc(100% - 26px));display:flex;align-items:center;justify-content:space-between;padding:11px 14px 11px 20px;border:1px solid rgba(255,255,255,.8);border-radius:99px;background:rgba(255,255,255,.66);backdrop-filter:blur(22px);box-shadow:0 8px 35px #4c40301a}.brand{font-weight:850;letter-spacing:-.05em}.brand span{color:#9d8057}.navlinks{display:flex;gap:19px;color:#69645d;font-size:12px;font-weight:650}.navlinks a:hover{color:#111}.navbtn,.primary{border:0;background:#191917;color:white;padding:11px 17px;border-radius:99px;font-weight:700;cursor:pointer;transition:.25s}.navbtn:hover,.primary:hover{transform:translateY(-2px);background:#4b443a}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center;padding:42px 0 82px;min-height:610px}.eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 13px;border-radius:99px;background:#fff9;border:1px solid #fff;font-size:11px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#74654f}.dot{width:7px;height:7px;border-radius:50%;background:#8e9b75;box-shadow:0 0 0 4px #8e9b7522}.hero h1{font-size:clamp(48px,7vw,88px);line-height:.99;letter-spacing:-.075em;margin:24px 0 20px;font-weight:850}.hero h1 em{font-family:Georgia,serif;font-weight:400;color:#927b5b}.lead{max-width:650px;color:#6d6860;font-size:clamp(15px,1.5vw,18px);line-height:1.75}.hero-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:27px}.secondary{padding:10px 17px;border:1px solid #cfc6b8;border-radius:99px;background:#ffffff80;font-weight:700;cursor:pointer}.hero-meta{display:flex;gap:25px;flex-wrap:wrap;margin-top:35px;color:#777067;font-size:12px}.hero-meta strong{display:block;color:#1c1b18;font-size:13px}.portrait-shell{position:relative;max-width:420px;margin-left:auto;padding:12px;border-radius:220px 220px 34px 34px;background:linear-gradient(145deg,#fff,#e5dbcb);box-shadow:var(--shadow);transform:rotate(1deg)}.portrait-shell:before{content:"";position:absolute;inset:-14px 20px 20px -14px;border:1px solid #b8a68b88;border-radius:220px 220px 34px 34px;z-index:-1}.portrait{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 35%;display:block;border-radius:210px 210px 25px 25px;background:#ddd}.photo-caption{position:absolute;bottom:26px;left:-22px;padding:13px 17px;background:#fffffff0;backdrop-filter:blur(15px);border:1px solid white;border-radius:16px;box-shadow:0 12px 35px #0002;font-size:11px;color:#777}.photo-caption strong{display:block;color:#222;font-size:14px}.section{padding:60px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}.kicker{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a18761;font-weight:800}.section h2{font-size:clamp(30px,4vw,45px);letter-spacing:-.06em;line-height:1.1;margin:7px 0 0}.count{font:italic 16px Georgia;color:#9d8a6e}.glass{background:var(--paper);border:1px solid #ffffffd9;box-shadow:var(--shadow);backdrop-filter:blur(22px);border-radius:var(--radius)}.about-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.about-card{padding:30px}.about-card p{white-space:pre-line;color:#5f5a53;margin:0}.personal{padding:27px}.personal h3{font-size:17px;margin:0 0 18px}.info{display:grid;gap:13px}.info div{border-bottom:1px solid var(--line);padding-bottom:10px}.info small{display:block;color:#91897e;font-size:10px;text-transform:uppercase;letter-spacing:.12em}.info strong{font-size:13px;font-weight:650;overflow-wrap:anywhere}.skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.skill{padding:23px;min-height:190px}.skill-no{font:italic 15px Georgia;color:#aa9069}.skill h3{font-size:16px;letter-spacing:-.03em;margin:10px 0}.skill ul,.entry ul{margin:0;padding-left:17px;color:#6c665e;font-size:13px}.skill li,.entry li{margin:5px 0}.timeline{display:grid;gap:13px}.entry{padding:22px 25px;display:grid;grid-template-columns:190px 1fr;gap:22px}.period{font-size:12px;color:#a18761;font-weight:750}.entry h3{font-size:17px;line-height:1.35;margin:0 0 4px;letter-spacing:-.025em}.org{font-size:13px;color:#777067;margin-bottom:9px}.tag{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#8a7556;background:#f0e8dc;padding:5px 9px;border-radius:99px;margin-bottom:9px;font-weight:800}.education-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.edu{padding:21px 23px}.edu h3{font-size:15px;margin:0 0 5px}.edu p{font-size:12px;color:#777067;margin:0}.edu .period{display:block;margin-top:12px}.achievement-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.achievement{padding:25px}.achievement h3{margin:0 0 15px;font-size:17px}.achievement ol{margin:0;padding-left:19px;color:#625d55;font-size:13px}.achievement li{padding:0 0 10px 4px}.lang-row{display:flex;gap:13px;flex-wrap:wrap}.lang{padding:17px 20px;min-width:210px}.lang strong{display:block;font-size:15px}.lang span{font-size:12px;color:#777067}.contact{padding:38px;display:flex;align-items:center;justify-content:space-between;gap:25px;background:#1c1b18;color:white}.contact p{color:#c4bdb1;margin:8px 0 0}.contact .kicker{color:#c2a77f}.contact-links{display:flex;flex-wrap:wrap;gap:9px}.contact-links a{padding:10px 14px;border:1px solid #ffffff42;border-radius:99px;font-size:12px}.contact-links a:hover{background:#ffffff18}.footer{padding:28px 0 40px;color:#8b847a;font-size:11px;display:flex;justify-content:space-between;gap:10px}.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s,transform .65s}.reveal.visible{opacity:1;transform:none}.loading{padding:100px 20px;text-align:center;color:#777}.error{max-width:650px;margin:40px auto;padding:25px;background:white;border-radius:20px;color:#8a332a}
@media(max-width:800px){.navlinks{display:none}.hero{grid-template-columns:1fr;gap:35px;padding:25px 0 55px}.hero-copy{order:1}.portrait-shell{order:0;margin:0 auto;width:min(76%,350px)}.hero h1{font-size:clamp(48px,13vw,74px)}.about-grid{grid-template-columns:1fr}.skill-grid{grid-template-columns:repeat(2,1fr)}.entry{grid-template-columns:1fr;gap:7px}.contact{align-items:flex-start;flex-direction:column}.section{padding:43px 0}}
@media(max-width:520px){.wrap{width:calc(100% - 28px)}.nav{margin-top:8px;padding:9px 10px 9px 15px}.navbtn{padding:9px 13px;font-size:11px}.hero{min-height:0}.hero-meta{gap:17px}.photo-caption{left:-10px;bottom:18px}.section-head{align-items:start}.skill-grid,.education-grid,.achievement-grid{grid-template-columns:1fr}.skill{min-height:0}.about-card,.personal{padding:22px}.entry{padding:19px}.contact{padding:27px 22px}.footer{flex-direction:column}.section h2{font-size:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}.reveal{opacity:1;transform:none}}
@media print{body{background:white}.nav,.hero-actions,.footer{display:none!important}.wrap{width:100%}.hero{min-height:0;padding:20px 0}.portrait-shell{max-width:220px}.section{padding:25px 0}.glass{box-shadow:none;background:white;border:1px solid #ddd;break-inside:avoid}.reveal{opacity:1;transform:none}.contact{background:#222!important;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app"><div class="loading">Menyiapkan CV…</div></div>
<script>
const DATA_URL = new URL("./database.json", location.href);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines = s => esc(s).replace(/\n/g,"<br><br>");
const list = arr => (arr||[]).map(x=>`<li>${esc(x)}</li>`).join("");
function render(d){
 const p=d.profile||{}, c=d.contact||{}, labels=d.labels||{};
 document.title=d.meta?.title||`${p.name||"Personal CV"}`;
 const wa=(c.whatsapp||"").replace(/[^\d]/g,"");
 const skills=(d.competencies||[]).map((x,i)=>`<article class="glass skill reveal"><span class="skill-no">0${i+1}</span><h3>${esc(x.title)}</h3><ul>${list(x.items)}</ul></article>`).join("");
 const exp=(d.experience||[]).map(x=>`<article class="glass entry reveal"><div><span class="tag">${esc(x.category)}</span><div class="period">${esc(x.period)}</div></div><div><h3>${esc(x.role)}</h3><div class="org">${esc(x.organization)}</div>${x.items?.length?`<ul>${list(x.items)}</ul>`:""}</div></article>`).join("");
 const edu=(d.education||[]).map(x=>`<article class="glass edu reveal"><h3>${esc(x.institution)}</h3><p>${esc(x.place)}${x.detail?" · "+esc(x.detail):""}</p><span class="period">${esc(x.period)}</span></article>`).join("");
 const ach=(a,title)=>`<article class="glass achievement reveal"><h3>${title}</h3><ol>${list(a)}</ol></article>`;
 document.getElementById("app").innerHTML=`
 <nav class="nav"><a class="brand" href="#top">RIZKI<span>.</span></a><div class="navlinks"><a href="#about">Profil</a><a href="#skills">Kompetensi</a><a href="#experience">Pengalaman</a><a href="#education">Pendidikan</a><a href="#contact">Kontak</a></div><button class="navbtn" onclick="window.print()">${esc(labels.download||"Cetak / PDF")} ↗</button></nav>
 <main id="top" class="wrap">
 <section class="hero"><div class="hero-copy"><div class="eyebrow"><i class="dot"></i>${esc(labels.availability||"Terbuka untuk kesempatan profesional")}</div><h1>${esc(p.name||"")}</h1><p class="lead">${esc(p.headline||"")}</p><div class="hero-actions"><a class="primary" href="#contact">Hubungi Saya ↗</a><a class="secondary" href="#experience">Jelajahi CV ↓</a></div><div class="hero-meta"><div><strong>Al-Azhar</strong>Kairo, Mesir</div><div><strong>Multidisipliner</strong>Education · Service · Media</div><div><strong>Arabic</strong>Fushah & Amiyah</div></div></div>
 <div class="portrait-shell"><img class="portrait" src="${p.photo||""}" alt="Foto Rizki Nur Amaludin"><div class="photo-caption"><strong>${esc(p.name||"")}</strong>${esc(p.location||"")}</div></div></section>
 <section id="about" class="section"><div class="section-head"><div><div class="kicker">01 / INTRODUCTION</div><h2>${esc(labels.about||"Profil Profesional")}</h2></div><span class="count">01 — 06</span></div><div class="about-grid"><article class="glass about-card reveal"><p>${lines(p.summary||"")}</p></article><aside class="glass personal reveal"><h3>Informasi Personal</h3><div class="info"><div><small>Nama Lengkap</small><strong>${esc(p.name)}</strong></div><div><small>Tempat, Tanggal Lahir</small><strong>${esc(p.birth)}</strong></div><div><small>Alamat</small><strong>${esc(p.location)}</strong></div><div><small>Status</small><strong>${esc(p.status)}</strong></div></div></aside></div></section>
 <section id="skills" class="section"><div class="section-head"><div><div class="kicker">02 / WHAT I DO</div><h2>${esc(labels.competencies||"Kompetensi Utama")}</h2></div><span class="count">Capabilities</span></div><div class="skill-grid">${skills}</div></section>
 <section id="experience" class="section"><div class="section-head"><div><div class="kicker">03 / CAREER JOURNEY</div><h2>${esc(labels.experience||"Pengalaman Profesional")}</h2></div><span class="count">${(d.experience||[]).length} Roles</span></div><div class="timeline">${exp}</div></section>
 <section id="education" class="section"><div class="section-head"><div><div class="kicker">04 / ACADEMIC BACKGROUND</div><h2>${esc(labels.education||"Pendidikan")}</h2></div><span class="count">Learning path</span></div><div class="education-grid">${edu}</div></section>
 <section id="achievements" class="section"><div class="section-head"><div><div class="kicker">05 / MILESTONES</div><h2>${esc(labels.achievements||"Prestasi & Pencapaian")}</h2></div></div><div class="achievement-grid">${ach(d.achievements?.academic,"Prestasi Akademik")}${ach(d.achievements?.nonAcademic,"Prestasi Non-Akademik")}</div></section>
 <section id="languages" class="section"><div class="section-head"><div><div class="kicker">06 / COMMUNICATION</div><h2>${esc(labels.languages||"Kemampuan Bahasa")}</h2></div></div><div class="lang-row">${(d.languages||[]).map(x=>`<div class="glass lang reveal"><strong>${esc(x.name)}</strong><span>${esc(x.level)}</span></div>`).join("")}</div></section>
 <section id="contact" class="section"><div class="glass contact reveal"><div><div class="kicker">${esc(labels.contact||"Mari Terhubung")}</div><h2>Let’s create something meaningful.</h2><p>Terbuka untuk kolaborasi, proyek, dan kesempatan profesional.</p></div><div class="contact-links">${c.whatsapp?`<a href="https://wa.me/${wa}" target="_blank" rel="noopener">WhatsApp ↗</a>`:""}${c.email?`<a href="mailto:${esc(c.email)}">Email ↗</a>`:""}${c.instagram?`<a href="https://instagram.com/${esc(c.instagram.replace(/^@/,""))}" target="_blank" rel="noopener">Instagram ↗</a>`:""}</div></div></section>
 <footer class="footer"><span>© ${new Date().getFullYear()} ${esc(p.name)}. All rights reserved.</span><span>Designed with clarity, purpose & detail.</span></footer>
 </main>`;
 const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible");obs.unobserve(e.target)}}),{threshold:.08});
 document.querySelectorAll(".reveal").forEach(el=>obs.observe(el));
}
fetch(DATA_URL).then(r=>{if(!r.ok)throw Error("database.json tidak ditemukan");return r.json()}).then(render).catch(e=>{document.getElementById("app").innerHTML=`<div class="error"><h2>Database belum dapat dimuat</h2><p>${esc(e.message)}</p><p>Pastikan <b>index.html</b> dan <b>database.json</b> berada dalam folder yang sama, lalu jalankan melalui web server (misalnya VS Code Live Server), bukan membuka file HTML langsung.</p></div>`});
</script>
</body></html>
