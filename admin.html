<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin CV</title>
<style>
:root{--cream:#F5EEDF;--ink:#16130F;--mut:#5d564b}
*{box-sizing:border-box;margin:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.08);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header h1{font-size:18px;margin-right:auto}
button,.b{font:600 14px system-ui;border:0;border-radius:99px;padding:10px 16px;background:#fff;color:var(--ink);cursor:pointer;border:1px solid rgba(0,0,0,.12)}
.k{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
#ed{max-width:860px;margin:0 auto;padding:0 16px}
.box{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:18px;padding:14px;margin:10px 0}
.box .box{background:#fbf8f1}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid rgba(0,0,0,.18);background:#fff}
textarea{min-height:72px;resize:vertical}
.row{display:flex;gap:8px;align-items:flex-start}.row>*:first-child{flex:1}
.mini{padding:6px 12px;font-size:13px}
.th{width:84px;height:84px;object-fit:cover;border-radius:12px;background:#eee;margin-top:6px}
h3{font-size:15px;margin:6px 0}
#st{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#st.on{opacity:1}
</style>
</head>
<body>
<header><h1>Admin CV</h1>
<label class="b" style="margin:0">Muat file<input type="file" id="fl" accept=".json" hidden></label>
<button id="pv">Pratinjau</button><button class="k" id="dl">Unduh database.json</button></header>
<div class="tabs" id="tabs" role="tablist"></div>
<div id="ed"></div><div id="st" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const LABEL={site:'Situs',photos:'Foto Utama',profile:'Profil',languages:'Bahasa',skills:'Kompetensi',education:'Pendidikan',experience:'Pengalaman',achievements:'Prestasi',gallery:'Galeri',contact:'Kontak'};
const TPL={'photos.slides':'','site.roles':'','profile.summary':'','profile.personal':{label:'',value:''},languages:{name:'',level:'',percent:80},skills:{title:'',items:['']},'skills.items':'',education:{school:'',program:'',period:'',note:''},experience:{group:'',items:[]},'experience.items':{title:'',org:'',period:'',points:[]},'experience.items.points':'',achievements:{group:'',items:['']},'achievements.items':'',gallery:{src:'',caption:''}};
let D=null,tab='site',dirty=0;
const toast=m=>{const s=$('#st');s.textContent=m;s.classList.add('on');setTimeout(()=>s.classList.remove('on'),2200)};
const blank=v=>Array.isArray(v)?[]:v&&typeof v==='object'?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,blank(x)])):typeof v==='number'?0:'';
const sp=p=>p.filter(x=>isNaN(x)).join('.');
const clone=o=>JSON.parse(JSON.stringify(o));
const isImg=k=>/^(src|main)$/.test(k)||k==='slides';
function field(o,k,path,lab){const v=o[k],p=[...path,k];
 if(Array.isArray(v))return list(v,p,lab||k);
 if(v&&typeof v==='object')return`<div class="box"><h3>${lab||k}</h3>${Object.keys(v).map(x=>field(v,x,p)).join('')}</div>`;
 const id='f'+Math.random().toString(36).slice(2),long=String(v).length>70||/note|summary|caption/.test(k);
 setTimeout(()=>{const e=document.getElementById(id);if(e)e.oninput=()=>{o[k]=typeof v==='number'?+e.value:e.value;dirty=1;const t=e.parentNode.querySelector('.th');if(t)t.src=e.value}});
 return`<label for="${id}">${lab||k}</label>${long?`<textarea id="${id}">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}" ${typeof v==='number'?'type="number"':''}>`}${isImg(k)&&v?`<img class="th" src="${esc(v)}" alt="" referrerpolicy="no-referrer">`:''}`}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function list(a,path,lab){const id='l'+Math.random().toString(36).slice(2);
 setTimeout(()=>{const r=document.getElementById(id);if(!r)return;
  r.querySelectorAll(':scope>.it').forEach(w=>{const i=+w.dataset.i;
   w.querySelectorAll(':scope>.row>.ctl>button').forEach(b=>b.onclick=()=>{
    if(b.dataset.a==='del'){a.splice(i,1)}else{const j=i+(b.dataset.a==='up'?-1:1);if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}dirty=1;render()})});
  r.querySelector(':scope>.add').onclick=()=>{const t=a.length?blank(a[0]):clone(TPL[sp(path)]??'');a.push(t);dirty=1;render()}});
 return`<div class="box" id="${id}"><h3>${lab}</h3>${a.map((x,i)=>`<div class="it" data-i="${i}"><div class="row"><div>${typeof x==='object'?Object.keys(x).map(k=>field(x,k,[...path,i])).join(''):field(a,i,path,'#'+(i+1))}</div><div class="ctl" style="display:grid;gap:4px;margin-top:8px"><button class="mini" data-a="up" aria-label="Naik">↑</button><button class="mini" data-a="dn" aria-label="Turun">↓</button><button class="mini" data-a="del" aria-label="Hapus">✕</button></div></div>${typeof x==='object'?'<hr style="border:0;border-top:1px dashed #ccc;margin:12px 0">':''}</div>`).join('')}<button class="mini add">+ Tambah</button></div>`}
function render(){$('#tabs').innerHTML=Object.keys(D).map(k=>`<button role="tab" aria-pressed="${k===tab}" data-t="${k}">${LABEL[k]||k}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 const o=D[tab];$('#ed').innerHTML=Array.isArray(o)?'':'';
 const holder={[tab]:o};$('#ed').innerHTML=field(holder,tab,[],LABEL[tab]||tab)}
function load(j){D=j;render()}
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='database.json';a.click();dirty=0;toast('database.json diunduh. Timpa file lama di hosting.')};
$('#pv').onclick=()=>{try{localStorage.setItem('cv_db_preview',JSON.stringify(D));window.open('index.html?preview=1','_blank')}catch{toast('Pratinjau tidak tersedia di browser ini')}};
$('#fl').onchange=e=>{const f=e.target.files[0];f&&f.text().then(t=>{try{load(JSON.parse(t));toast('File dimuat')}catch{toast('File JSON tidak valid')}})};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
fetch('database.json',{cache:'no-cache'}).then(r=>r.json()).then(load).catch(()=>{$('#ed').innerHTML='<div class="box">Tidak dapat membaca database.json. Klik <b>Muat file</b> dan pilih database.json Anda.</div>'});
</script>
</body>
</html>
